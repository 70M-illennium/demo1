spring.application.name=demo1

# --- storage: the monitor's own history database ---
# Spring Data JPA + Hibernate ddl-auto bind here (it is the @Primary DataSource).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/monitor?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fares}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fares}
# fail fast when the store is down so the scheduler thread isn't blocked 30s per
# collector (Hikari's default); the write then goes to SnapshotWriteBuffer
spring.datasource.hikari.connection-timeout=5000
# this pool serves every client GET too (all read endpoints query the store), so it's
# sized for that, not just the collectors. HikariCP's own guidance is to size for the
# DB's CPU cores, not for client concurrency - a bigger number does not mean more
# throughput past what the DB can actually execute in parallel. 10/5 is a reasonable
# starting point for the small monitor-store container; caching the /latest endpoints
# (still to build) is what actually keeps read traffic from scaling with client count.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- target: the database being monitored (read-only, JdbcTemplate only) ---
monitor.target.datasource.url=${MONITOR_TARGET_DATASOURCE_URL:jdbc:mysql://localhost:3306/myDB?useSSL=false&allowPublicKeyRetrieval=true}
monitor.target.datasource.username=${MONITOR_TARGET_DATASOURCE_USERNAME:fares}
monitor.target.datasource.password=${MONITOR_TARGET_DATASOURCE_PASSWORD:fares}
monitor.target.datasource.hikari.maximum-pool-size=3
monitor.target.datasource.hikari.read-only=true
monitor.target.datasource.hikari.pool-name=target-pool
# fail fast when the monitored server is down instead of blocking the scheduler
# thread for Hikari's 30s default
monitor.target.datasource.hikari.connection-timeout=5000

# --- base auth: the one ADMIN account, gates every non-GET /api/** endpoint ---
monitor.admin.username=${MONITOR_ADMIN_USERNAME:fares}
monitor.admin.password=${MONITOR_ADMIN_PASSWORD:fares}

# --- health-check thresholds (defaults live in HealthCheckProperties; override here) ---
monitor.health.disk-warn-percent=90
monitor.health.disk-crit-percent=95
monitor.health.long-transaction-seconds=300
monitor.health.slow-query-rate-per-min=10
monitor.health.tmp-disk-table-rate-per-min=5
monitor.health.buffer-pool-hit-ratio-warn-percent=95
monitor.health.buffer-pool-hit-ratio-crit-percent=90
monitor.health.connection-warn-percent=85
monitor.health.connection-crit-percent=95
monitor.health.latency-sigma-k=4
monitor.health.collection-gap-seconds=180
monitor.health.baseline-window=20
monitor.health.open-after=2
monitor.health.resolve-after=3

# --- retention: per-minute snapshots are pruned older than days + grace-hours ---
monitor.retention.days=10
monitor.retention.grace-hours=2
monitor.retention.enabled=true
