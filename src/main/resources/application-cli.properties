# Active only under --spring.profiles.active=cli (Spring's standard
# application-{profile}.properties convention - no code change needed for this).
#
# The scheduled collectors keep running in the background during a CLI session on
# purpose (the agent's tools read whatever they've most recently written), but their
# per-cycle INFO logs were interrupting the chat prompt every ~60s. This quiets that
# noise without stopping collection - WARN/ERROR (an alert opening, a real failure)
# still print, since those are worth seeing even mid-conversation.
logging.level.com.fares.demo1.service=WARN
